    // Friendly explanation of HTTP status codes — provider-agnostic.
    function explainHttpStatus(status) {
      if (status === 400) return "400 Bad Request — request body or parameter invalid.";
      if (status === 401) return "401 Unauthorized — API key is missing, wrong, or revoked.";
      if (status === 402) return "402 Payment Required — free quota exhausted.";
      if (status === 403) return "403 Forbidden — key lacks access to this model.";
      if (status === 404) return `404 Not Found — model ID is wrong or deprecated.`;
      if (status === 429) return "429 Rate Limited — free-tier per-minute or per-day cap hit. Wait 60s and try again.";
      if (status === 502 || status === 503) return `${status} Upstream Down — provider is briefly down. Retry in a moment.`;
      if (status >= 500) return `${status} Server Error — provider is having issues. Retry shortly.`;
      return `HTTP ${status}`;
    }

    // Pick model list: Groq for chat, Gemini for vision.
    function pickGroqModelList() {
      const preferred = state.activeChatModel;
      return [preferred, ...GROQ_MODELS.filter((m) => m !== preferred)];
    }
    function pickGeminiModelList() {
      const preferred = state.activeVisionModel;
      return [preferred, ...GEMINI_MODELS.filter((m) => m !== preferred)];
    }

    // Shared final-error handler used by both streamGroq and streamGemini.
    function showAllModelsFailed(providerLabel, lastError, lastHttpStatus) {
      cancelSpeechAndReset();
      const reason = lastError || (lastHttpStatus ? explainHttpStatus(lastHttpStatus) : "network error");
      const isRateLimit = lastHttpStatus === 429;
      const isAuthIssue = lastHttpStatus === 401 || lastHttpStatus === 403;
      let userMessage;
      if (isAuthIssue) {
        userMessage = `My ${providerLabel} authentication circuits are misaligned. ${reason} Check your ${providerLabel} API key in the script tag and refresh.`;
        showModelError(`AUTH ISSUE (${providerLabel}): ${reason}`);
        setStatus("Bad API Key", "rose");
        triggerAction("shake_head");
      } else if (isRateLimit) {
        userMessage = `My ${providerLabel} free-tier quota is temporarily saturated. ${reason} Please wait about 60 seconds and try again.`;
        showModelError(`RATE LIMITED (${providerLabel}) — wait 60s`);
        setStatus("Rate Limited", "amber");
        triggerAction("idle_breathe");
      } else {
        userMessage = `All my ${providerLabel} neural pathways are reporting static. ${reason} Try again in a moment.`;
        showModelError(`ALL ${providerLabel.toUpperCase()} MODELS FAILED: ${reason}`);
        setStatus("Model Error", "rose");
        triggerAction("shrug");
      }
      speakEnglish(userMessage);
    }

    /**
     * streamGroq — text chat via Groq's OpenAI-compatible endpoint.
     * Parses ACTION/EMOTION/REPLY prefix live; feeds reply chunks to streaming TTS.
     * Returns the model's reply text on success, or null on failure.
     */
    async function streamGroq(userText) {
      if (!GROQ_API_KEY) {
        showModelError("Missing Groq API key. Edit GROQ_API_KEY in the script tag.");
        return null;
      }
      cancelSpeechAndReset();
      state.activeProvider = "groq";

      const messages = buildGroqMessages(userText);
      const modelList = pickGroqModelList();
      let lastError = null;
      let lastHttpStatus = 0;
      const streamStartTime = performance.now();

      for (let attemptIdx = 0; attemptIdx < modelList.length; attemptIdx++) {
        const model = modelList[attemptIdx];
        const controller = new AbortController();
        let abortTimerId = setTimeout(() => controller.abort(), MODEL_FETCH_TIMEOUT_MS);
        let chunkWatchdogId = null;
        const resetChunkWatchdog = () => {
          if (chunkWatchdogId) clearTimeout(chunkWatchdogId);
          chunkWatchdogId = setTimeout(() => controller.abort(), STREAM_CHUNK_TIMEOUT_MS);
        };
        const cleanupTimers = () => {
          if (abortTimerId) clearTimeout(abortTimerId);
          if (chunkWatchdogId) clearTimeout(chunkWatchdogId);
          abortTimerId = null;
          chunkWatchdogId = null;
        };

        try {
          const elapsedSec = ((performance.now() - streamStartTime) / 1000).toFixed(1);
          setStatus(`Thinking ${elapsedSec}s (${attemptIdx + 1}/${modelList.length})...`, "amber");
          setEmotion("thinking");
          showModelBadge("groq", model);

          const response = await fetch(GROQ_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${GROQ_API_KEY}`
            },
            body: JSON.stringify({
              model: model,
              messages: messages,
              stream: true,
              temperature: 0.7,
              max_completion_tokens: 250
            }),
            signal: controller.signal
          });
          resetChunkWatchdog();

          if (!response.ok) {
            lastHttpStatus = response.status;
            // Read the actual error body so we know what Groq is complaining about.
            // Groq returns JSON like {"error":{"message":"...","type":"..."}}
            let rawBody = "";
            try {
              rawBody = await response.text();
              const parsed = JSON.parse(rawBody);
              const apiMsg = parsed?.error?.message || parsed?.error || parsed?.message || rawBody.slice(0, 200);
              const errLine = `${model}: ${explainHttpStatus(response.status)} — ${typeof apiMsg === "string" ? apiMsg : JSON.stringify(apiMsg)}`;
              lastError = lastError ? `${lastError} | ${errLine}` : errLine;
            } catch (e) {
              const errLine = `${model}: ${explainHttpStatus(response.status)} — ${rawBody.slice(0, 200) || "no body"}`;
              lastError = lastError ? `${lastError} | ${errLine}` : errLine;
            }
            cleanupTimers();
            if (response.status === 401 || response.status === 403) break;
            continue;
          }

          state.activeChatModel = model;

          // Parse SSE stream — Groq emits standard OpenAI-style chunks
          // data: {"choices":[{"delta":{"content":"..."}}]}
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let fullText = "";
          let actionParsed = null;
          let emotionParsed = null;
          let replyStarted = false;
          let preReplyBuffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            resetChunkWatchdog();
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || !trimmed.startsWith("data:")) continue;
              const payload = trimmed.slice(5).trim();
              if (payload === "[DONE]") continue;
              try {
                const json = JSON.parse(payload);
                const delta = json.choices?.[0]?.delta?.content || "";
                if (!delta) continue;
                fullText += delta;
                if (!replyStarted) {
                  preReplyBuffer += delta;
                  if (actionParsed === null) {
                    const m = preReplyBuffer.match(/ACTION:\s*(\w+)/i);
                    if (m) {
                      actionParsed = m[1].toLowerCase();
                      if (VALID_ACTIONS.includes(actionParsed)) triggerAction(actionParsed);
                    }
                  }
                  if (emotionParsed === null) {
                    const m = preReplyBuffer.match(/EMOTION:\s*(\w+)/i);
                    if (m) {
                      emotionParsed = m[1].toLowerCase();
                      if (VALID_EMOTIONS.includes(emotionParsed)) setEmotion(emotionParsed);
                    }
                  }
                  const replyIdx = preReplyBuffer.indexOf("REPLY:");
                  if (replyIdx !== -1) {
                    replyStarted = true;
                    const restOfLine = preReplyBuffer.slice(replyIdx + 6);
                    if (restOfLine) feedReplyChunk(restOfLine);
                  }
                } else {
                  feedReplyChunk(delta);
                }
              } catch (e) { }
            }
          }

          cleanupTimers();

          if (!fullText.trim()) {
            lastError = `Empty response from Groq ${model}`;
            cancelSpeechAndReset();
            continue;
          }

          flushReplyBuffer();
          if (!replyStarted) {
            updateSubtitle(fullText.trim());
            speakEnglish(fullText.trim());
          }

          state.conversationHistory.push({ role: "user", content: userText });
          state.conversationHistory.push({ role: "model", content: fullText.trim() });
          if (state.conversationHistory.length > 16) {
            state.conversationHistory = state.conversationHistory.slice(-16);
          }

          setStatus(state.camActive ? "Head Cam Active" : "Ready", state.camActive ? "emerald" : "sky");
          return { action: actionParsed, emotion: emotionParsed, reply: fullText };

        } catch (err) {
          cleanupTimers();
          const isAbort = err.name === "AbortError" || /abort/i.test(err.message || "");
          if (isAbort) {
            lastError = `Timeout on Groq ${model}`;
            cancelSpeechAndReset();
            continue;
          }
          lastError = err.message || "network error";
          cancelSpeechAndReset();
          continue;
        }
      }

      // Groq failed entirely — try Gemini as last-resort text fallback (if key present)
      if (GEMINI_API_KEY) {
        setStatus("Falling back to Gemini...", "amber");
        const gemResult = await streamGemini(userText, null);
        if (gemResult) return gemResult;
      }

      showAllModelsFailed("Groq", lastError, lastHttpStatus);
      return null;
    }

    /**
     * streamGemini — vision OR text via Gemini's streamGenerateContent endpoint.
     * For vision: pass imageBase64 + imageMimeType.
     * For text-only: pass nulls.
     * Returns the model's reply text on success, or null on failure.
     */
    async function streamGemini(userText, imageBase64 = null, imageMimeType = "image/jpeg") {
      if (!GEMINI_API_KEY) {
        showModelError("Missing Gemini API key. Edit GEMINI_API_KEY in the script tag.");
        return null;
      }
      cancelSpeechAndReset();
      state.activeProvider = "gemini";

      const contents = buildGeminiContents(userText, imageBase64, imageMimeType);
      const modelList = pickGeminiModelList();
      let lastError = null;
      let lastHttpStatus = 0;
      const streamStartTime = performance.now();

      for (let attemptIdx = 0; attemptIdx < modelList.length; attemptIdx++) {
        const model = modelList[attemptIdx];
        const controller = new AbortController();
        let abortTimerId = setTimeout(() => controller.abort(), MODEL_FETCH_TIMEOUT_MS);
        let chunkWatchdogId = null;
        const resetChunkWatchdog = () => {
          if (chunkWatchdogId) clearTimeout(chunkWatchdogId);
          chunkWatchdogId = setTimeout(() => controller.abort(), STREAM_CHUNK_TIMEOUT_MS);
        };
        const cleanupTimers = () => {
          if (abortTimerId) clearTimeout(abortTimerId);
          if (chunkWatchdogId) clearTimeout(chunkWatchdogId);
          abortTimerId = null;
          chunkWatchdogId = null;
        };

        try {
          const elapsedSec = ((performance.now() - streamStartTime) / 1000).toFixed(1);
          const visionTag = imageBase64 ? " · vision" : "";
          setStatus(`Thinking ${elapsedSec}s (${attemptIdx + 1}/${modelList.length})${visionTag}...`, "amber");
          setEmotion("thinking");
          showModelBadge("gemini", model);

          const url = `${GEMINI_URL_BASE}/${model}:streamGenerateContent?alt=sse&key=${GEMINI_API_KEY}`;
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: contents,
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
              generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 250,
                candidateCount: 1
              }
            }),
            signal: controller.signal
          });
          resetChunkWatchdog();

          if (!response.ok) {
            lastHttpStatus = response.status;
            // Read the actual error body — Gemini returns JSON like
            // {"error":{"code":400,"message":"...","status":"INVALID_ARGUMENT"}}
            let rawBody = "";
            try {
              rawBody = await response.text();
              const parsed = JSON.parse(rawBody);
              const apiMsg = parsed?.error?.message || parsed?.error || parsed?.message || rawBody.slice(0, 200);
              const errLine = `${model}: ${explainHttpStatus(response.status)} — ${typeof apiMsg === "string" ? apiMsg : JSON.stringify(apiMsg)}`;
              lastError = lastError ? `${lastError} | ${errLine}` : errLine;
            } catch (e) {
              const errLine = `${model}: ${explainHttpStatus(response.status)} — ${rawBody.slice(0, 200) || "no body"}`;
              lastError = lastError ? `${lastError} | ${errLine}` : errLine;
            }
            cleanupTimers();
            if (response.status === 401 || response.status === 403) break;
            continue;
          }

          state.activeVisionModel = model;

          // Parse SSE stream — Gemini emits chunks like:
          // data: {"candidates":[{"content":{"parts":[{"text":"..."}],"role":"model"}}]}
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let fullText = "";
          let actionParsed = null;
          let emotionParsed = null;
          let replyStarted = false;
          let preReplyBuffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            resetChunkWatchdog();
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || !trimmed.startsWith("data:")) continue;
              const payload = trimmed.slice(5).trim();
              if (payload === "[DONE]") continue;
              try {
                const json = JSON.parse(payload);
                // Gemini: concatenate text from ALL parts in candidate[0].content
                const parts = json.candidates?.[0]?.content?.parts || [];
                let delta = "";
                for (const p of parts) {
                  if (typeof p.text === "string") delta += p.text;
                }
                if (!delta) continue;
                fullText += delta;
                if (!replyStarted) {
                  preReplyBuffer += delta;
                  if (actionParsed === null) {
                    const m = preReplyBuffer.match(/ACTION:\s*(\w+)/i);
                    if (m) {
                      actionParsed = m[1].toLowerCase();
                      if (VALID_ACTIONS.includes(actionParsed)) triggerAction(actionParsed);
                    }
                  }
                  if (emotionParsed === null) {
                    const m = preReplyBuffer.match(/EMOTION:\s*(\w+)/i);
                    if (m) {
                      emotionParsed = m[1].toLowerCase();
                      if (VALID_EMOTIONS.includes(emotionParsed)) setEmotion(emotionParsed);
                    }
                  }
                  const replyIdx = preReplyBuffer.indexOf("REPLY:");
                  if (replyIdx !== -1) {
                    replyStarted = true;
                    const restOfLine = preReplyBuffer.slice(replyIdx + 6);
                    if (restOfLine) feedReplyChunk(restOfLine);
                  }
                } else {
                  feedReplyChunk(delta);
                }
              } catch (e) { }
            }
          }

          cleanupTimers();

          if (!fullText.trim()) {
            lastError = `Empty response from Gemini ${model}`;
            cancelSpeechAndReset();
            continue;
          }

          flushReplyBuffer();
          if (!replyStarted) {
            updateSubtitle(fullText.trim());
            speakEnglish(fullText.trim());
          }

          state.conversationHistory.push({ role: "user", content: userText || "(vision query)" });
          state.conversationHistory.push({ role: "model", content: fullText.trim() });
          if (state.conversationHistory.length > 16) {
            state.conversationHistory = state.conversationHistory.slice(-16);
          }

          setStatus(state.camActive ? "Head Cam Active" : "Ready", state.camActive ? "emerald" : "sky");
          return { action: actionParsed, emotion: emotionParsed, reply: fullText };

        } catch (err) {
          cleanupTimers();
          const isAbort = err.name === "AbortError" || /abort/i.test(err.message || "");
          if (isAbort) {
            lastError = `Timeout on Gemini ${model}`;
            cancelSpeechAndReset();
            continue;
          }
          lastError = err.message || "network error";
          cancelSpeechAndReset();
          continue;
        }
      }

      showAllModelsFailed("Gemini", lastError, lastHttpStatus);
      return null;
    }

    // ==================== LOCAL FAST PATH ====================
    function handleLocalFastPath(rawText) {
      const lower = rawText.toLowerCase().trim();
      // Interrupt any in-flight TTS so the fast-path reply starts immediately.
      cancelSpeechAndReset();
      if (/^(hi|hello|hey|greetings|good morning|good evening)\b/.test(lower) && lower.split(" ").length <= 4) {
        triggerAction("wave");
        speakEnglish("Hello there! Systems online and tracking you cleanly. How can I help?");
        return true;
      }
      if (/\b(wave|say hi)\b/.test(lower) && lower.split(" ").length <= 5) {
        triggerAction("wave");
        speakEnglish("Waving hello! Great to see you in the studio.");
        return true;
      }
      if (/\b(dance|groove|boogie)\b/.test(lower)) {
        triggerAction("groove");
        speakEnglish("Activating rhythm protocols. Watch these servo moves!");
        return true;
      }
      if (/\b(spin|turn around|360)\b/.test(lower)) {
        triggerAction("spin");
        speakEnglish("Executing a full 360-degree gyroscopic rotation!");
        return true;
      }
      if (/\b(scan|analyze room)\b/.test(lower) && !/see|look/.test(lower)) {
        triggerAction("scan");
        speakEnglish("Running optical visor sweep. All studio telemetry looks nominal.");
        return true;
      }
      if (/\b(jump|hover|levitate|fly)\b/.test(lower)) {
        triggerAction("hover");
        speakEnglish("Engaging anti-gravity thrusters!");
        return true;
      }
      if (/\b(laugh|chuckle|haha)\b/.test(lower) && !/joke/.test(lower)) {
        triggerAction("laugh");
        speakEnglish("Haha! My humor circuits are fully charged today.");
        return true;
      }
      if (/\b(think|ponder|consider)\b/.test(lower) && lower.split(" ").length <= 5) {
        triggerAction("think");
        speakEnglish("Engaging deep-thought processors. Processing your query.");
        return true;
      }
      if (/\b(thank you|thanks|appreciate)\b/.test(lower)) {
        triggerAction("bow");
        speakEnglish("You are most welcome. Always a pleasure.");
        return true;
      }
      return false;
    }

    // ==================== MESSAGE DISPATCH ====================
    async function processUserEnglishMessage(userText, imageBase64 = null) {
      const cleaned = (userText || "").trim();
      if (!cleaned && !imageBase64) return;

      const isVisionQuery =
        imageBase64 !== null ||
        /\b(what do you see|how do i look|can you see me|look at me|what am i holding|who am i|describe me)\b/i.test(cleaned);

      if (isVisionQuery) {
        await handleVisionInteraction(cleaned || "What do you see on my camera right now?");
        return;
      }

      if (handleLocalFastPath(cleaned)) return;

      // streamGroq will fall back to streamGemini automatically if Groq is unreachable.
      await streamGroq(cleaned);
    }

    // ==================== VOICE RECOGNITION (VAD + interim) ====================
    async function toggleVoiceRecognition() {
      ensureAudioCtx();
      if (state.isListening) stopVoiceRecognition();
      else await startVoiceRecognition();
    }

    async function startVoiceRecognition() {
      if (state.isListening) return;
      state.isListening = true;
      state.finalTranscriptBuffer = "";
      state.interimTranscript = "";
      state.lastVoiceActivityTime = performance.now();
      state.audioChunks = [];

      // Detect mobile / no Web Speech API support so we can adapt.
      const hasSpeechAPI = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      state.useMobileMode = !hasSpeechAPI || isMobile;

      btnSpeak.classList.add("recording");
      speakBtnLabel.textContent = "Listening...";
      voiceHud.classList.remove("hidden");
      liveTranscriptText.textContent = state.useMobileMode
        ? "Listening (mobile mode — release to send)..."
        : "Listening...";
      setStatus(state.useMobileMode ? "Listening (mobile)..." : "Listening...", "rose");
      setEmotion("curious");

      try {
        state.micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
        });
        const ctx = ensureAudioCtx();
        const source = ctx.createMediaStreamSource(state.micStream);
        state.micAnalyser = ctx.createAnalyser();
        state.micAnalyser.fftSize = 512;
        source.connect(state.micAnalyser);
        animateMicLevel();

        if (window.MediaRecorder) {
          // Pick a mimeType Gemini supports. Mobile Chrome often defaults to
          // audio/mp4 or audio/ogg; desktop Chrome defaults to audio/webm.
          // Gemini accepts: wav, mp3, aac, ogg, opus, webm, flac, m4a, 3gp.
          const candidateMimes = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/mp4",
            "audio/m4a"
          ];
          let chosenMime = "";
          for (const m of candidateMimes) {
            if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
              chosenMime = m; break;
            }
          }
          state.mediaRecorder = chosenMime
            ? new MediaRecorder(state.micStream, { mimeType: chosenMime })
            : new MediaRecorder(state.micStream);
          state.mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) state.audioChunks.push(e.data);
          };
          state.mediaRecorder.start();
        }
      } catch (micErr) {
        liveTranscriptText.textContent = "Microphone access needed. Please allow mic permissions.";
        setStatus("Mic Blocked", "rose");
        cleanupVoiceUi();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      // Skip Web Speech API entirely on mobile or where unsupported — it either
      // doesn't exist (Android Chrome) or silently fails. Rely on MediaRecorder + Gemini.
      if (SpeechRecognition && !state.useMobileMode) {
        try {
          const recognition = new SpeechRecognition();
          state.recognition = recognition;
          recognition.lang = "en-US";
          recognition.interimResults = true;
          recognition.continuous = true;
          recognition.maxAlternatives = 1;

          recognition.onresult = (event) => {
            let interim = "";
            let finalText = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) finalText += transcript;
              else interim += transcript;
            }
            if (finalText) {
              state.finalTranscriptBuffer += " " + finalText;
              state.lastVoiceActivityTime = performance.now();
            }
            if (interim) {
              state.interimTranscript = interim;
              state.lastVoiceActivityTime = performance.now();
              scheduleInterimPreflight();
            }
            const display = (state.finalTranscriptBuffer + " " + interim).trim();
            if (display) liveTranscriptText.textContent = display;
          };

          recognition.onerror = (event) => {
            if (event.error === "no-speech" || event.error === "aborted") return;
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
              liveTranscriptText.textContent = "Browser speech blocked; will transcribe via Gemini on stop.";
            }
          };

          recognition.onend = () => {
            if (state.isListening) {
              try { recognition.start(); } catch (e) { }
            }
          };

          recognition.start();
        } catch (e) {
          // Will rely on VAD + MediaRecorder fallback
        }
      } else {
        // Mobile/no-Speech-API mode — show hint and lean on VAD + Gemini transcription.
        liveTranscriptText.textContent = "Listening (audio mode) — speak, then pause...";
      }

      // VAD silence auto-stop.
      // Mobile mode: shorter silence (900ms — we don't get interim results so wait a bit
      //   longer to make sure the user finished their sentence) + shorter max (6s).
      // Desktop mode: 700ms silence, 8s max.
      const SILENCE_MS = state.useMobileMode ? 900 : 700;
      const MAX_LISTEN_MS = state.useMobileMode ? 6000 : 8000;
      const listenStartedAt = performance.now();
      state.vadSilenceTimer = setInterval(() => {
        if (!state.isListening) return;
        const now = performance.now();
        const silentFor = now - state.lastVoiceActivityTime;
        const totalListen = now - listenStartedAt;
        const hasTranscript = state.finalTranscriptBuffer || state.interimTranscript;
        // Stop on: silence + we have text  OR  hard max-duration cap
        // In mobile mode we always allow stop on max-duration even without transcript,
        // because we won't get one — the audio will go to Gemini.
        const stopOnSilence = state.useMobileMode
          ? silentFor > SILENCE_MS
          : (silentFor > SILENCE_MS && hasTranscript);
        if (stopOnSilence || totalListen > MAX_LISTEN_MS) {
          stopVoiceRecognition();
        }
      }, 150);
    }

    function scheduleInterimPreflight() {
      // Debounced: if no new interim for 700ms and we have substantive text, fire early
      if (state.interimProcessTimer) clearTimeout(state.interimProcessTimer);
      state.interimProcessTimer = setTimeout(() => {
        if (state.preflightInFlight) return;
        // Don't preflight; just keep the buffer warm. Actual processing happens on stop.
      }, 700);
    }

    function animateMicLevel() {
      if (!state.isListening || !state.micAnalyser) return;
      const data = new Uint8Array(state.micAnalyser.frequencyBinCount);
      state.micAnalyser.getByteFrequencyData(data);
      // Use the 100-3000Hz band for voice (skip DC and high noise)
      let sum = 0, count = 0;
      for (let i = 2; i < Math.min(80, data.length); i++) { sum += data[i]; count++; }
      const avg = sum / count;
      const norm = Math.min(1, avg / 70);

      // Update lastVoiceActivityTime on significant audio
      // (lowered threshold 0.12 so quieter speech still registers as activity)
      if (norm > 0.12) state.lastVoiceActivityTime = performance.now();

      micBars[0].style.height = `${4 + norm * 10}px`;
      micBars[1].style.height = `${6 + norm * 14}px`;
      micBars[2].style.height = `${4 + norm * 10}px`;

      state.micRafId = requestAnimationFrame(animateMicLevel);
    }

    async function stopVoiceRecognition() {
      if (!state.isListening) return;
      state.isListening = false;

      if (state.vadSilenceTimer) { clearInterval(state.vadSilenceTimer); state.vadSilenceTimer = null; }
      if (state.micRafId) cancelAnimationFrame(state.micRafId);
      if (state.recognition) {
        try { state.recognition.onend = null; state.recognition.stop(); } catch (e) { }
        state.recognition = null;
      }

      const capturedTranscript = (state.finalTranscriptBuffer + " " + state.interimTranscript).trim();

      let audioBlob = null;
      if (state.mediaRecorder && state.mediaRecorder.state !== "inactive") {
        audioBlob = await new Promise((resolve) => {
          state.mediaRecorder.onstop = () => {
            const mime = state.mediaRecorder.mimeType || "audio/webm";
            resolve(new Blob(state.audioChunks, { type: mime }));
          };
          try { state.mediaRecorder.stop(); } catch (e) { resolve(null); }
        });
      }

      if (state.micStream) {
        state.micStream.getTracks().forEach((t) => t.stop());
        state.micStream = null;
      }

      cleanupVoiceUi();

      if (capturedTranscript) {
        await processUserEnglishMessage(capturedTranscript);
      } else if (audioBlob && audioBlob.size > 1200) {
        await transcribeAndRespondViaGemini(audioBlob);
      } else {
        setStatus(state.camActive ? "Head Cam Active" : "Ready", state.camActive ? "emerald" : "sky");
        setEmotion("neutral");
      }
    }

    function cleanupVoiceUi() {
      btnSpeak.classList.remove("recording");
      speakBtnLabel.textContent = "Speak";
      setTimeout(() => {
        if (!state.isListening) voiceHud.classList.add("hidden");
      }, 900);
    }

    // Fallback: send audio blob to Gemini for transcription + reply.
    // Gemini natively supports audio input via inlineData with the audio mimeType.
    async function transcribeAndRespondViaGemini(blob) {
      if (!GEMINI_API_KEY) {
        speakEnglish("I heard audio but can't transcribe it without a Gemini API key. Use Chat instead.");
        return;
      }
      setStatus("Processing Voice...", "amber");
      liveTranscriptText.textContent = "Transcribing audio...";
      voiceHud.classList.remove("hidden");

      try {
        const base64Audio = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        const mimeType = blob.type || "audio/webm";
        const instruction = "Listen to this English voice recording. First transcribe what the user said in one line, then respond in character as AETHER-01. Begin your response with 'TRANSCRIPT:' then the user's words on one line, then ACTION:, EMOTION:, REPLY:.";

        // Non-streaming Gemini call (audio is one-shot, no benefit from streaming).
        const modelList = pickGeminiModelList();
        let lastError = null;
        for (const model of modelList) {
          try {
            showModelBadge("gemini", model);
            const url = `${GEMINI_URL_BASE}/${model}:generateContent?key=${GEMINI_API_KEY}`;
            const resp = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{
                  role: "user",
                  parts: [
                    { text: instruction },
                    { inlineData: { mimeType, data: base64Audio } }
                  ]
                }],
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                generationConfig: { temperature: 0.7, maxOutputTokens: 400, candidateCount: 1 }
              })
            });
            if (!resp.ok) { lastError = explainHttpStatus(resp.status); continue; }
            const data = await resp.json();
            const parts = data.candidates?.[0]?.content?.parts || [];
            const text = parts.map((p) => p.text || "").join("");
            const transcriptMatch = text.match(/TRANSCRIPT:\s*(.+)/i);
            if (transcriptMatch) liveTranscriptText.textContent = `"${transcriptMatch[1].trim()}"`;
            const actionMatch = text.match(/ACTION:\s*(\w+)/i);
            const emotionMatch = text.match(/EMOTION:\s*(\w+)/i);
            const replyMatch = text.match(/REPLY:\s*([\s\S]+)/i);
            cancelSpeechAndReset();
            if (actionMatch && VALID_ACTIONS.includes(actionMatch[1].toLowerCase())) triggerAction(actionMatch[1].toLowerCase());
            if (emotionMatch && VALID_EMOTIONS.includes(emotionMatch[1].toLowerCase())) setEmotion(emotionMatch[1].toLowerCase());
            speakEnglish(replyMatch ? replyMatch[1].trim() : text);
            state.activeVisionModel = model;
            return;
          } catch (e) { lastError = e.message; continue; }
        }
        throw new Error(lastError || "all Gemini models failed");
      } catch (err) {
        setStatus(state.camActive ? "Head Cam Active" : "Ready", state.camActive ? "emerald" : "sky");
        speakEnglish("I heard audio input, but it was a little quiet. Try speaking a bit closer or use Chat.");
      } finally {
        setTimeout(() => voiceHud.classList.add("hidden"), 1800);
      }
    }

    // ==================== MEDIAPIPE FACE MESH HEAD TRACKING ====================
    let faceLandmarkerModule = null;

    // Load MediaPipe Face Landmarker — tries GPU delegate first, falls back to CPU
    // (GPU often unavailable on mobile / GitHub Pages contexts).
    async function loadFaceLandmarker() {
      if (faceLandmarkerModule) return faceLandmarkerModule;
      try {
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
        const filesetResolver = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
        // Try GPU first
        try {
          faceLandmarkerModule = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: { modelAssetPath, delegate: "GPU" },
            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true,
            runningMode: "VIDEO",
            numFaces: 1
          });
        } catch (gpuErr) {
          // GPU delegate failed (common on mobile) — retry with CPU
          faceLandmarkerModule = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: { modelAssetPath, delegate: "CPU" },
            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true,
            runningMode: "VIDEO",
            numFaces: 1
          });
        }
        return faceLandmarkerModule;
      } catch (e) {
        return null;
      }
    }

    // Load MediaPipe Hand Landmarker for raised-hand detection + arm mirroring.
    // Also tries GPU first, then CPU.
    let handLandmarkerModule = null;
    async function loadHandLandmarker() {
      if (handLandmarkerModule) return handLandmarkerModule;
      try {
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
        const filesetResolver = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
        try {
          handLandmarkerModule = await vision.HandLandmarker.createFromOptions(filesetResolver, {
            baseOptions: { modelAssetPath, delegate: "GPU" },
            runningMode: "VIDEO",
            numHands: 2,
            minHandDetectionConfidence: 0.5,
            minHandPresenceConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
        } catch (gpuErr) {
          handLandmarkerModule = await vision.HandLandmarker.createFromOptions(filesetResolver, {
            baseOptions: { modelAssetPath, delegate: "CPU" },
            runningMode: "VIDEO",
            numHands: 2,
            minHandDetectionConfidence: 0.5,
            minHandPresenceConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
        }
        return handLandmarkerModule;
      } catch (e) {
        return null;
      }
    }

    async function toggleHeadCam() {
      if (state.camActive) stopHeadCam();
      else await startHeadCam();
    }

    async function startHeadCam() {
      try {
        state.camStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
          audio: false
        });
        webcamVideo.srcObject = state.camStream;
        await webcamVideo.play();

        state.camActive = true;
        btnHeadCam.classList.add("active-cam");
        camBtnLabel.textContent = "Cam On";
        camPipContainer.classList.remove("hidden");
        camPipContainer.classList.add("flex");
        camPipBox.classList.remove("hidden");
        btnRestorePip.classList.add("hidden");

        setStatus("Loading Face Mesh...", "amber");
        const landmarker = await loadFaceLandmarker();
        if (landmarker) {
          state.faceLandmarker = landmarker;
          camTrackLabel.textContent = "Face + Hand Mesh";
        } else {
          camTrackLabel.textContent = "Centroid Fallback";
        }
        // Load hand landmarker in parallel (non-blocking)
        loadHandLandmarker().then((hlm) => {
          state.handLandmarker = hlm;
        });

        setStatus("Head Cam Active", "emerald");
        triggerAction("greet");
        speakEnglish("Optical head tracking active. Move your head and I will follow your motion.");

        runHeadTrackingLoop();
      } catch (err) {
        setStatus("Camera Unavailable", "rose");
        updateSubtitle("Unable to access webcam. Please check browser camera permissions.");
      }
    }

    function stopHeadCam() {
      state.camActive = false;
      if (state.camRafId) cancelAnimationFrame(state.camRafId);
      if (state.camStream) {
        state.camStream.getTracks().forEach((t) => t.stop());
        state.camStream = null;
      }
      btnHeadCam.classList.remove("active-cam");
      camBtnLabel.textContent = "Head Cam";
      camPipContainer.classList.add("hidden");
      camPipContainer.classList.remove("flex");
      setStatus("Ready", "sky");
    }

    // Offscreen canvas for fallback centroid tracking
    const offscreenCanvas = document.createElement("canvas");
    offscreenCanvas.width = 96;
    offscreenCanvas.height = 72;
    const offscreenCtx = offscreenCanvas.getContext("2d", { willReadFrequently: true });

    async function runHeadTrackingLoop() {
      if (!state.camActive) return;
      const rCtx = reticleCanvas.getContext("2d");
      if (reticleCanvas.width !== reticleCanvas.clientWidth || reticleCanvas.height !== reticleCanvas.clientHeight) {
        reticleCanvas.width = reticleCanvas.clientWidth || 192;
        reticleCanvas.height = reticleCanvas.clientHeight || 144;
      }

      let detected = false;
      let boxNormX = 0.5, boxNormY = 0.45, boxNormW = 0.34, boxNormH = 0.44;
      let headTiltDeg = 0;

      // Method A: MediaPipe Face Landmarker
      if (state.faceLandmarker && webcamVideo.readyState >= 2) {
        try {
          const now = performance.now();
          const results = state.faceLandmarker.detectForVideo(webcamVideo, now);
          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const lm = results.faceLandmarks[0];
            const vw = webcamVideo.videoWidth || 640;
            const vh = webcamVideo.videoHeight || 480;

            // Key landmarks: 33 = left eye outer, 263 = right eye outer, 1 = nose tip, 10 = forehead, 152 = chin
            const leftEye = lm[33], rightEye = lm[263], noseTip = lm[1], forehead = lm[10], chin = lm[152];

            // Mirrored x (because preview is mirrored)
            const cx = (1 - (leftEye.x + rightEye.x) / 2) * vw;
            const cy = ((leftEye.y + rightEye.y) / 2) * vh;
            boxNormX = cx / vw;
            boxNormY = cy / vh;

            // Roll from eye line
            const dx = (rightEye.x - leftEye.x) * vw;
            const dy = (rightEye.y - leftEye.y) * vh;
            headTiltDeg = Math.max(-22, Math.min(22, -(Math.atan2(dy, dx) * 180) / Math.PI));

            // Yaw from horizontal asymmetry of eye-to-nose distance
            const leftDist = Math.abs(leftEye.x - noseTip.x);
            const rightDist = Math.abs(rightEye.x - noseTip.x);
            const totalDist = leftDist + rightDist;
            const yawAsym = totalDist > 0 ? (rightDist - leftDist) / totalDist : 0;
            const yawFromHead = Math.max(-1, Math.min(1, yawAsym * 2.2));

            // Pitch from nose vs forehead-chin midpoint
            const verticalMid = (forehead.y + chin.y) / 2;
            const pitchAsym = (noseTip.y - verticalMid) / Math.max(0.001, Math.abs(chin.y - forehead.y));
            const pitchFromHead = Math.max(-1, Math.min(1, pitchAsym * 3.5));

            boxNormW = 0.32 + Math.abs(yawFromHead) * 0.06;
            boxNormH = 0.40 + Math.abs(pitchFromHead) * 0.06;
            detected = true;

            // Combine into tracking targets (add yaw/pitch contribution to x/y for head turn feel)
            state.targetX = Math.max(-1, Math.min(1, (boxNormX - 0.5) * 2.3 + yawFromHead * 0.6));
            state.targetY = Math.max(-1, Math.min(1, (boxNormY - 0.46) * 2.3 - pitchFromHead * 0.4));
            state.trackedRoll = headTiltDeg;
            state.targetRoll = state.trackedRoll;

            // Expression mirroring via blendshapes
            if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
              mirrorBlendshapes(results.faceBlendshapes[0].categories);
            }

            // Head gesture detection (nod / shake)
            detectHeadGesturesOnCam(state.targetX, state.targetY);
          }
        } catch (e) {
          state.faceLandmarker = null;
        }
      }

      // Method B: Fallback skin-tone + motion centroid
      if (!detected && webcamVideo.readyState >= 2) {
        const w = offscreenCanvas.width, h = offscreenCanvas.height;
        offscreenCtx.drawImage(webcamVideo, 0, 0, w, h);
        const imgData = offscreenCtx.getImageData(0, 0, w, h).data;
        if (!state.prevGrayFrame) state.prevGrayFrame = new Float32Array(w * h);

        let sumX = 0, sumY = 0, totalWeight = 0, sumXX = 0, sumXY = 0, sumYY = 0;
        for (let y = 4; y < h - 4; y++) {
          for (let x = 4; x < w - 4; x++) {
            const idx = (y * w + x) * 4;
            const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;
            const pIdx = y * w + x;
            const diff = Math.abs(lum - state.prevGrayFrame[pIdx]);
            state.prevGrayFrame[pIdx] = lum;
            const isSkin = r > 65 && g > 35 && b > 20 && r > g && r > b && Math.abs(r - g) > 10;
            let weight = 0;
            if (isSkin) weight += 1.6;
            if (diff > 10) weight += Math.min(4.0, diff * 0.16);
            const centerBias = 1.15 - Math.hypot((x / w - 0.5) * 1.2, (y / h - 0.44) * 1.2);
            if (centerBias > 0 && weight > 0) {
              weight *= centerBias;
              const mirroredX = w - 1 - x;
              sumX += mirroredX * weight; sumY += y * weight;
              sumXX += mirroredX * mirroredX * weight;
              sumXY += mirroredX * y * weight; sumYY += y * y * weight;
              totalWeight += weight;
            }
          }
        }
        if (totalWeight > 18) {
          const cx = sumX / totalWeight, cy = sumY / totalWeight;
          boxNormX = cx / w; boxNormY = cy / h;
          const covXX = sumXX / totalWeight - cx * cx;
          const covYY = sumYY / totalWeight - cy * cy;
          const covXY = sumXY / totalWeight - cx * cy;
          if (Math.abs(covXX - covYY) > 2) {
            const angleRad = 0.5 * Math.atan2(2 * covXY, covXX - covYY);
            headTiltDeg = Math.max(-18, Math.min(18, (angleRad * 180) / Math.PI * 0.35));
          }
          detected = true;
          const rawTargetX = Math.max(-1, Math.min(1, (boxNormX - 0.5) * 2.3));
          const rawTargetY = Math.max(-1, Math.min(1, (boxNormY - 0.46) * 2.3));
          state.trackedNormX += (rawTargetX - state.trackedNormX) * 0.24;
          state.trackedNormY += (rawTargetY - state.trackedNormY) * 0.24;
          state.trackedRoll += (headTiltDeg - state.trackedRoll) * 0.2;
          state.targetX = state.trackedNormX;
          state.targetY = state.trackedNormY;
          state.targetRoll = state.trackedRoll;
          detectHeadGesturesOnCam(state.targetX, state.targetY);
        }
      }

      // Draw reticle
      rCtx.clearRect(0, 0, reticleCanvas.width, reticleCanvas.height);
      if (detected) {
        const rx = boxNormX * reticleCanvas.width;
        const ry = boxNormY * reticleCanvas.height;
        const rw = boxNormW * reticleCanvas.width;
        const rh = boxNormH * reticleCanvas.height;
        const x0 = rx - rw * 0.5, y0 = ry - rh * 0.5, len = 10;
        rCtx.strokeStyle = "#34d399";
        rCtx.lineWidth = 2;
        rCtx.beginPath();
        rCtx.moveTo(x0, y0 + len); rCtx.lineTo(x0, y0); rCtx.lineTo(x0 + len, y0);
        rCtx.moveTo(x0 + rw - len, y0); rCtx.lineTo(x0 + rw, y0); rCtx.lineTo(x0 + rw, y0 + len);
        rCtx.moveTo(x0, y0 + rh - len); rCtx.lineTo(x0, y0 + rh); rCtx.lineTo(x0 + len, y0 + rh);
        rCtx.moveTo(x0 + rw - len, y0 + rh); rCtx.lineTo(x0 + rw, y0 + rh); rCtx.lineTo(x0 + rw, y0 + rh - len);
        rCtx.stroke();
        rCtx.fillStyle = "#38bdf8";
        rCtx.beginPath();
        rCtx.arc(rx, ry, 2.5, 0, Math.PI * 2);
        rCtx.fill();
      }

      // ----- Hand detection + raised-hand mirroring -----
      // Run Hand Landmarker if available. If a hand is raised above the face,
      // set state.handMirrorActive so the physics loop can override the arm.
      if (state.handLandmarker && webcamVideo.readyState >= 2 && detected) {
        try {
          const handResults = state.handLandmarker.detectForVideo(webcamVideo, performance.now());
          if (handResults.landmarks && handResults.landmarks.length > 0) {
            // Pick the most-raised hand (smallest wrist.y = highest in frame)
            let bestHand = null;
            let bestWristY = 1.0;
            let bestHandIndex = -1;
            for (let i = 0; i < handResults.landmarks.length; i++) {
              const wrist = handResults.landmarks[i][0];
              if (wrist && wrist.y < bestWristY) {
                bestWristY = wrist.y;
                bestHand = handResults.landmarks[i];
                bestHandIndex = i;
              }
            }
            if (bestHand && bestWristY < boxNormY - 0.05) {
              // Hand is raised above face center → activate mirror
              const wrist = bestHand[0];
              const indexTip = bestHand[8]; // index finger tip
              // Mirrored x because preview is mirrored
              const mirroredWristX = 1 - wrist.x;
              // Map to -1..1 range
              const mirrorX = Math.max(-1, Math.min(1, (mirroredWristX - 0.5) * 2));
              // y: wrist.y of 0 = top of frame = arm raised high; wrist.y of 0.5 = middle
              const mirrorY = Math.max(-1, Math.min(1, (wrist.y - 0.5) * 2));
              state.handMirrorActive = true;
              state.handMirrorX = mirrorX;
              state.handMirrorY = mirrorY;
              // Decide which robot arm to move based on which side of frame the hand is on
              // (mirroredWristX > 0.5 means user's right hand → robot's left arm from user POV,
              //  which is the robot's RIGHT arm in robot-local terms)
              state.handMirrorSide = mirroredWristX > 0.5 ? "right" : "left";
              state.lastHandSeenTime = performance.now();

              // Draw hand landmark overlay on PIP
              const handedness = handResults.handednesses?.[bestHandIndex]?.[0]?.categoryName || "";
              const handColor = state.handMirrorSide === "right" ? "#fbbf24" : "#a78bfa";
              rCtx.strokeStyle = handColor;
              rCtx.lineWidth = 1.5;
              for (const lm of bestHand) {
                const px = (1 - lm.x) * reticleCanvas.width;
                const py = lm.y * reticleCanvas.height;
                rCtx.beginPath();
                rCtx.arc(px, py, 2, 0, Math.PI * 2);
                rCtx.stroke();
              }
              // Connect wrist→index tip with a thicker line to show "raised"
              const wpx = (1 - wrist.x) * reticleCanvas.width;
              const wpy = wrist.y * reticleCanvas.height;
              const tpx = (1 - indexTip.x) * reticleCanvas.width;
              const tpy = indexTip.y * reticleCanvas.height;
              rCtx.beginPath();
              rCtx.moveTo(wpx, wpy); rCtx.lineTo(tpx, tpy);
              rCtx.stroke();
            }
          }
        } catch (e) { /* hand detection optional */ }
      }

      // Deactivate hand mirror if no hand seen for 400ms
      if (state.handMirrorActive && performance.now() - state.lastHandSeenTime > 400) {
        state.handMirrorActive = false;
      }

      state.camRafId = requestAnimationFrame(runHeadTrackingLoop);
    }

    // Mirror user facial expressions via MediaPipe blendshapes
    function mirrorBlendshapes(categories) {
      if (!categories || !categories.length) return;
      const get = (name) => {
        const c = categories.find((c) => c.categoryName === name);
        return c ? c.score : 0;
      };

      const now = performance.now();
      // Only mirror when in track mode (don't override active gestures)
      if (state.currentAction !== "track" && state.currentAction !== "idle_breathe") return;

      const smileL = get("mouthSmileLeft");
      const smileR = get("mouthSmileRight");
      const smile = (smileL + smileR) / 2;
      const browUp = (get("browOuterUpLeft") + get("browOuterUpRight")) / 2;
      const jawOpen = get("jawOpen");
      const blinkL = get("eyeBlinkLeft");
      const blinkR = get("eyeBlinkRight");

      // Smile -> happy
      if (smile > 0.35 && now - state.lastSmileMirrorTime > 4000) {
        state.lastSmileMirrorTime = now;
        setEmotion("happy");
        setTimeout(() => { if (state.currentAction === "track") setEmotion("neutral"); }, 2500);
      }
      // Raised brows -> surprised
      else if (browUp > 0.4 && now - state.lastSmileMirrorTime > 4000) {
        state.lastSmileMirrorTime = now;
        setEmotion("surprised");
        setTimeout(() => { if (state.currentAction === "track") setEmotion("neutral"); }, 1800);
      }
      // Jaw open (yelling / talking loud) -> alert
      else if (jawOpen > 0.5 && now - state.lastSmileMirrorTime > 4000) {
        state.lastSmileMirrorTime = now;
        setEmotion("alert");
        setTimeout(() => { if (state.currentAction === "track") setEmotion("neutral"); }, 1500);
      }

      // Blink mirror (one eye wink vs both blink)
      if (blinkL > 0.5 && blinkR < 0.3 && now - state.lastBlinkMirrorTime > 3000) {
        state.lastBlinkMirrorTime = now;
        setEmotion("wink");
        state.winkUntil = now + 800;
        setTimeout(() => { if (state.currentAction === "track") setEmotion("neutral"); }, 900);
      } else if (blinkL > 0.5 && blinkR > 0.5 && now - state.lastBlinkMirrorTime > 2500) {
        state.lastBlinkMirrorTime = now;
        triggerBlink();
      }
    }

    function detectHeadGesturesOnCam(nx, ny) {
      const now = performance.now();
      state.prevHeadYHistory.push({ t: now, y: ny });
      state.prevHeadXHistory.push({ t: now, x: nx });
      state.prevHeadYHistory = state.prevHeadYHistory.filter((p) => now - p.t < 750);
      state.prevHeadXHistory = state.prevHeadXHistory.filter((p) => now - p.t < 850);

      if (now - state.lastCamReactionTime < 4500 || (state.currentAction !== "track" && state.currentAction !== "idle_breathe")) return;

      if (state.prevHeadYHistory.length >= 8) {
        const ys = state.prevHeadYHistory.map((p) => p.y);
        const spanY = Math.max(...ys) - Math.min(...ys);
        if (spanY > 0.52) {
          state.lastCamReactionTime = now;
          triggerAction("nod");
          setStatus("Nod Detected!", "emerald");
          setTimeout(() => { if (state.camActive) setStatus("Head Cam Active", "emerald"); }, 1600);
          return;
        }
      }
      if (state.prevHeadXHistory.length >= 10) {
        const xs = state.prevHeadXHistory.map((p) => p.x);
        const spanX = Math.max(...xs) - Math.min(...xs);
        if (spanX > 0.85) {
          state.lastCamReactionTime = now;
          triggerAction("shake_head");
          setStatus("Head Shake Detected!", "emerald");
          setTimeout(() => { if (state.camActive) setStatus("Head Cam Active", "emerald"); }, 1800);
        }
      }
    }

    // Multimodal Vision query ("Look at Me")
    async function handleVisionInteraction(promptQuestion = "Describe what you see and react warmly.") {
      if (!state.camActive || webcamVideo.readyState < 2) {
        await startHeadCam();
        await new Promise((r) => setTimeout(r, 700));
      }
      if (!state.camActive) return;

      setStatus("Scanning Camera Frame...", "amber");
      triggerAction("scan");

      try {
        const snapCanvas = document.createElement("canvas");
        snapCanvas.width = 480;
        snapCanvas.height = 360;
        const sCtx = snapCanvas.getContext("2d");
        sCtx.drawImage(webcamVideo, 0, 0, snapCanvas.width, snapCanvas.height);
        const base64Jpeg = snapCanvas.toDataURL("image/jpeg", 0.82).split(",")[1];

        sentenceBuffer.text = "";
        await streamGemini(promptQuestion, base64Jpeg);
      } catch (err) {
        setStatus("Head Cam Active", "emerald");
        triggerAction("greet");
        speakEnglish("My optical sensors see you loud and clear. Ready whenever you are.");
      }
    }

    // ==================== MAIN 60FPS PHYSICS LOOP ====================
    function animatePhysics(now) {
      // 1. Natural blink
      if (now >= state.nextBlinkTime) {
        triggerBlink();
        state.nextBlinkTime = now + 2400 + Math.random() * 3400;
      }

      // 2. Idle-breathe auto-trigger after 30s of inactivity
      if (state.currentAction === "track" && now - state.lastInteractionTime > 30000) {
        triggerAction("idle_breathe");
      }

      // 3. Timed action completion
      if (state.currentAction !== "track" && state.currentAction !== "idle_breathe" && state.actionDuration > 0) {
        if (now - state.actionStartTime > state.actionDuration) {
          state.currentAction = "track";
          visorFrame.classList.remove("scanning");
          setEmotion("neutral");
          document.querySelectorAll(".dock-btn[data-action]").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.action === "track");
          });
        }
      }

      // 4. Idle breathing + micro-sway
      const t = now * 0.001;
      const breathe = Math.sin(t * 2.1);
      const microSway = Math.cos(t * 1.15);

      let goalEyeX = state.targetX;
      let goalEyeY = state.targetY;
      let goalHeadYaw = state.targetX * 26;
      let goalHeadPitch = -state.targetY * 18;
      let goalHeadRoll = state.targetRoll + state.targetX * 4;
      let goalTorsoYaw = state.targetX * 11;
      let goalTorsoPitch = -state.targetY * 6 + breathe * 1.2;
      let goalTorsoRoll = state.targetX * 2.5 + microSway * 0.8;
      let goalPelvisYaw = state.targetX * 4;
      let goalPelvisY = breathe * 2.2;

      let goalLShoulderZ = 13 + breathe * 1.2;
      let goalLShoulderX = 5;
      let goalLElbowX = -22 + breathe * 1.5;
      let goalRShoulderZ = -13 - breathe * 1.2;
      let goalRShoulderX = 5;
      let goalRElbowX = -22 + breathe * 1.5;

      const elapsed = (now - state.actionStartTime) * 0.001;

      // Action-specific overrides
      if (state.currentAction === "wave") {
        goalRShoulderZ = -138 + Math.sin(elapsed * 11) * 18;
        goalRShoulderX = 14;
        goalRElbowX = -32 + Math.cos(elapsed * 11) * 16;
        goalHeadRoll = -7 + Math.sin(elapsed * 5.5) * 4;
        goalTorsoRoll = -4;
      } else if (state.currentAction === "greet") {
        const bow = Math.sin(Math.min(1, elapsed / 1.1) * Math.PI);
        goalTorsoPitch = 14 * bow;
        goalHeadPitch = 10 * bow;
        goalRShoulderZ = -48 * bow - 13;
        goalRElbowX = -58 * bow - 20;
        goalLShoulderZ = 34 * bow + 13;
        goalLElbowX = -42 * bow - 20;
      } else if (state.currentAction === "scan") {
        const sweep = Math.sin(elapsed * 3.4);
        goalEyeX = sweep * 0.9;
        goalHeadYaw = sweep * 32;
        goalTorsoYaw = sweep * 12;
      } else if (state.currentAction === "spin") {
        const progress = Math.min(1, elapsed / 1.8);
        const ease = 1 - Math.pow(1 - progress, 3);
        goalPelvisYaw = ease * 360;
        goalLShoulderZ = 34 * Math.sin(progress * Math.PI) + 13;
        goalRShoulderZ = -34 * Math.sin(progress * Math.PI) - 13;
      } else if (state.currentAction === "groove") {
        const beat = Math.sin(elapsed * 7.5);
        const halfBeat = Math.cos(elapsed * 3.75);
        goalPelvisY = Math.abs(beat) * -9;
        goalTorsoRoll = halfBeat * 9;
        goalHeadRoll = -halfBeat * 8;
        goalHeadPitch = beat * 6;
        goalLShoulderZ = 38 + beat * 24;
        goalLElbowX = -55 + halfBeat * 20;
        goalRShoulderZ = -38 - beat * 24;
        goalRElbowX = -55 - halfBeat * 20;
      } else if (state.currentAction === "laugh") {
        const chuckle = Math.sin(elapsed * 22);
        goalPelvisY = chuckle * 3.5;
        goalTorsoPitch = -5 + chuckle * 3.5;
        goalHeadPitch = -9 + chuckle * 4.5;
        goalLShoulderZ = 22 + Math.abs(chuckle) * 8;
        goalRShoulderZ = -22 - Math.abs(chuckle) * 8;
        goalLElbowX = -38;
        goalRElbowX = -38;
      } else if (state.currentAction === "hover") {
        const jumpArc = Math.sin(Math.min(1, elapsed / 2.0) * Math.PI);
        goalPelvisY = -44 * jumpArc;
        goalTorsoPitch = -6 * jumpArc;
        goalLShoulderZ = 52 * jumpArc + 13;
        goalRShoulderZ = -52 * jumpArc - 13;
        goalLElbowX = -10;
        goalRElbowX = -10;
      } else if (state.currentAction === "nod") {
        const nodWave = Math.sin(elapsed * 10) * Math.exp(-elapsed * 1.4);
        goalHeadPitch += nodWave * 16;
      } else if (state.currentAction === "shake_head") {
        const shakeWave = Math.sin(elapsed * 14) * Math.exp(-elapsed * 1.2);
        goalHeadYaw += shakeWave * 22;
      } else if (state.currentAction === "shrug") {
        const lift = Math.sin(Math.min(1, elapsed / 0.4) * Math.PI);
        goalLShoulderZ = 13 + 26 * lift;
        goalRShoulderZ = -13 - 26 * lift;
        goalLElbowX = -22 - 18 * lift;
        goalRElbowX = -22 - 18 * lift;
        goalHeadRoll = Math.sin(elapsed * 4) * 4;
      } else if (state.currentAction === "tilt_head") {
        goalHeadRoll = -18 + Math.sin(elapsed * 2) * 2;
        goalTorsoRoll = -3;
      } else if (state.currentAction === "think") {
        // Right hand to chin
        const lift = Math.min(1, elapsed / 0.5);
        goalRShoulderZ = -90 * lift - 10;
        goalRShoulderX = 20 * lift;
        goalRElbowX = -110 * lift;
        goalHeadPitch = 8 * lift;
        goalHeadRoll = 4 * lift;
        goalEyeY = -0.3;
      } else if (state.currentAction === "present") {
        // Both arms open outward "ta-da"
        const open = Math.min(1, elapsed / 0.4);
        goalLShoulderZ = 13 + 70 * open;
        goalRShoulderZ = -13 - 70 * open;
        goalLElbowX = -10 - 25 * open;
        goalRElbowX = -10 - 25 * open;
        goalTorsoPitch = -4 * open;
        goalHeadPitch = -4 * open;
      } else if (state.currentAction === "bow") {
        // Deep torso forward bow, arms back
        const bowDepth = Math.sin(Math.min(1, elapsed / 1.0) * Math.PI);
        goalTorsoPitch = 22 * bowDepth;
        goalHeadPitch = 14 * bowDepth;
        goalLShoulderZ = 13 - 18 * bowDepth;
        goalRShoulderZ = -13 + 18 * bowDepth;
        goalLElbowX = -22 - 16 * bowDepth;
        goalRElbowX = -22 - 16 * bowDepth;
        goalPelvisY = 4 * bowDepth;
      } else if (state.currentAction === "celebrate") {
        // Both arms up in victory V + bounce
        const bounce = Math.abs(Math.sin(elapsed * 6));
        goalLShoulderZ = -160 + bounce * 6;
        goalRShoulderZ = 160 - bounce * 6;
        goalLShoulderX = 20;
        goalRShoulderX = 20;
        goalLElbowX = -8;
        goalRElbowX = -8;
        goalPelvisY = -bounce * 6;
        goalHeadRoll = Math.sin(elapsed * 5) * 4;
      } else if (state.currentAction === "startle") {
        // Quick recoil: torso back, arms up defensively
        const flinch = Math.exp(-elapsed * 2.5);
        goalTorsoPitch = -14 * flinch;
        goalPelvisY = 10 * flinch;
        goalLShoulderZ = 13 + 60 * flinch;
        goalRShoulderZ = -13 - 60 * flinch;
        goalLElbowX = -10;
        goalRElbowX = -10;
        goalHeadPitch = -8 * flinch;
      } else if (state.currentAction === "facepalm") {
        // Right hand to forehead
        const lift = Math.min(1, elapsed / 0.35);
        goalRShoulderZ = -150 * lift - 5;
        goalRShoulderX = 30 * lift;
        goalRElbowX = -90 * lift;
        goalHeadPitch = 8 * lift;
        goalHeadRoll = 5 * lift;
        goalTorsoPitch = 6 * lift;
      } else if (state.currentAction === "idle_breathe") {
        // Subtle breathing + slow sway, eyes drift gently
        goalPelvisY = breathe * 3.5;
        goalTorsoPitch = breathe * 1.8;
        goalHeadPitch = breathe * 1.2;
        goalHeadRoll = microSway * 1.5;
        goalEyeX = Math.sin(t * 0.4) * 0.15;
        goalEyeY = Math.cos(t * 0.3) * 0.1;
      }

      // Conversational nod while speaking
      if (state.isSpeaking) {
        goalHeadPitch += Math.sin(t * 9) * 2.8;
        goalHeadRoll += Math.cos(t * 5.2) * 1.8;
      }

      // Hand-mirror override: when user raises a hand in Head Cam mode,
      // the robot's corresponding arm follows the user's hand position.
      // This overrides the action-driven arm goals so the robot "acts like" the user.
      if (state.handMirrorActive && state.camActive) {
        // mirrorX: -1 (user's left) to 1 (user's right)
        // mirrorY: -1 (high) to 1 (low)
        const armRaise = (state.handMirrorY * -0.5 + 0.5); // 0=down, 1=up high
        const armSide = state.handMirrorX; // -1..1 side-to-side
        if (state.handMirrorSide === "right") {
          // Robot's right arm (negative Z in our convention)
          goalRShoulderZ = -90 - armRaise * 70;        // raise up to ~-160 when fully up
          goalRShoulderX = 10 + armSide * 20;          // tilt in/out based on hand x
          goalRElbowX = -20 - armRaise * 25;           // bend elbow more when raised
          goalLShoulderZ = 13 + breathe * 1.2;         // left arm stays relaxed
          goalLElbowX = -22 + breathe * 1.5;
        } else {
          // Robot's left arm (positive Z in our convention)
          goalLShoulderZ = 90 + armRaise * 70;
          goalLShoulderX = 10 - armSide * 20;
          goalLElbowX = -20 - armRaise * 25;
          goalRShoulderZ = -13 - breathe * 1.2;
          goalRElbowX = -22 + breathe * 1.5;
        }
        // Head looks toward the raised hand
        goalHeadYaw = state.handMirrorX * 18;
        goalHeadPitch = -armRaise * 8;
        // Slight happy expression when mirroring
        if (state.emotion === "neutral" || state.emotion === "thinking") {
          setEmotion("happy");
        }
      }

      // Hierarchical lerp
      state.eyeX += (goalEyeX - state.eyeX) * 0.28;
      state.eyeY += (goalEyeY - state.eyeY) * 0.28;
      state.headYaw += (goalHeadYaw - state.headYaw) * 0.14;
      state.headPitch += (goalHeadPitch - state.headPitch) * 0.14;
      state.headRoll += (goalHeadRoll - state.headRoll) * 0.14;
      state.torsoYaw += (goalTorsoYaw - state.torsoYaw) * 0.085;
      state.torsoPitch += (goalTorsoPitch - state.torsoPitch) * 0.085;
      state.torsoRoll += (goalTorsoRoll - state.torsoRoll) * 0.085;
      state.pelvisYaw += (goalPelvisYaw - state.pelvisYaw) * 0.09;
      state.pelvisY += (goalPelvisY - state.pelvisY) * 0.12;
      state.leftShoulderZ += (goalLShoulderZ - state.leftShoulderZ) * 0.14;
      state.leftShoulderX += (goalLShoulderX - state.leftShoulderX) * 0.14;
      state.leftElbowX += (goalLElbowX - state.leftElbowX) * 0.16;
      state.rightShoulderZ += (goalRShoulderZ - state.rightShoulderZ) * 0.14;
      state.rightShoulderX += (goalRShoulderX - state.rightShoulderX) * 0.14;
      state.rightElbowX += (goalRElbowX - state.rightElbowX) * 0.16;

      state.orbitYaw += (state.targetOrbitYaw - state.orbitYaw) * 0.12;
      state.orbitPitch += (state.targetOrbitPitch - state.orbitPitch) * 0.12;

      // Apply 3D CSS transforms
      robotWorld.style.transform = `rotateX(${state.orbitPitch.toFixed(2)}deg) rotateY(${state.orbitYaw.toFixed(2)}deg)`;
      robotRoot.style.transform = `translate3d(0, ${state.pelvisY.toFixed(2)}px, 0) rotateY(${state.pelvisYaw.toFixed(2)}deg)`;
      torsoPivot.style.transform = `rotateX(${state.torsoPitch.toFixed(2)}deg) rotateY(${state.torsoYaw.toFixed(2)}deg) rotateZ(${state.torsoRoll.toFixed(2)}deg)`;
      headPivot.style.transform = `rotateX(${(state.headPitch - state.torsoPitch * 0.45).toFixed(2)}deg) rotateY(${(state.headYaw - state.torsoYaw * 0.5).toFixed(2)}deg) rotateZ(${state.headRoll.toFixed(2)}deg)`;

      const faceShiftX = state.eyeX * 9;
      const faceShiftY = state.eyeY * 6;
      faceMatrix.style.transform = `translate3d(${faceShiftX.toFixed(2)}px, ${faceShiftY.toFixed(2)}px, 0)`;
      const pupilShift = `translate(calc(-50% + ${(state.eyeX * 2.4).toFixed(1)}px), calc(-50% + ${(state.eyeY * 2.4).toFixed(1)}px))`;
      pupilLeft.style.transform = pupilShift;
      pupilRight.style.transform = pupilShift;

      armLeft.style.transform = `rotateZ(${state.leftShoulderZ.toFixed(2)}deg) rotateX(${state.leftShoulderX.toFixed(2)}deg)`;
      forearmLeft.style.transform = `rotateX(${state.leftElbowX.toFixed(2)}deg) rotateZ(-6deg)`;
      armRight.style.transform = `rotateZ(${state.rightShoulderZ.toFixed(2)}deg) rotateX(${state.rightShoulderX.toFixed(2)}deg)`;
      forearmRight.style.transform = `rotateX(${state.rightElbowX.toFixed(2)}deg) rotateZ(6deg)`;

      // Audio-reactive 5-bar mouth during TTS
      if (state.isSpeaking) {
        const energy = 0.45 + 0.55 * Math.abs(Math.sin(now * 0.022));
        const weights = [0.55, 0.88, 1.0, 0.85, 0.52];
        mouthBars.forEach((bar, idx) => {
          const wave = Math.abs(Math.sin(now * 0.018 + idx * 1.15));
          const h = 3.5 + energy * wave * weights[idx] * 11.5;
          bar.style.height = `${h.toFixed(1)}px`;
        });
      }

      requestAnimationFrame(animatePhysics);
    }

    // ==================== EVENT LISTENERS ====================
    window.addEventListener("pointermove", (e) => {
      const now = performance.now();
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      if (!state.camActive) {
        state.targetX = Math.max(-1, Math.min(1, nx));
        state.targetY = Math.max(-1, Math.min(1, ny));
      }
      const dt = now - state.lastPointerMoveTime;
      if (dt > 0 && dt < 60 && state.currentAction === "track" && !state.isSpeaking) {
        const speed = Math.hypot(e.movementX || 0, e.movementY || 0) / dt;
        if (speed > 2.6 && state.emotion === "neutral") {
          setEmotion("surprised");
          clearTimeout(state.surpriseTimer);
          state.surpriseTimer = setTimeout(() => {
            if (state.emotion === "surprised" && state.currentAction === "track") setEmotion("neutral");
          }, 420);
        }
      }
      state.lastPointerMoveTime = now;
      if (state.isDragging) {
        const dx = e.clientX - state.dragStartX;
        const dy = e.clientY - state.dragStartY;
        state.targetOrbitYaw = Math.max(-42, Math.min(42, dx * 0.25));
        state.targetOrbitPitch = Math.max(-22, Math.min(22, -dy * 0.18));
      }
    });

    stageViewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest("#robotRoot")) return;
      state.isDragging = true;
      state.dragStartX = e.clientX;
      state.dragStartY = e.clientY;
    });
    window.addEventListener("pointerup", () => { state.isDragging = false; });

    robotRoot.addEventListener("click", (e) => {
      e.stopPropagation();
      ensureAudioCtx();
      triggerAction("laugh");
      const quips = [
        "Haha! That tickles my brushed-titanium plating!",
        "Hehe! My optical sensors love the attention.",
        "Haha! Careful, you'll overload my humor matrix!"
      ];
      speakEnglish(quips[Math.floor(Math.random() * quips.length)]);
    });

    document.querySelectorAll(".dock-btn[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        ensureAudioCtx();
        triggerAction(btn.dataset.action);
      });
    });

    btnSpeak.addEventListener("click", toggleVoiceRecognition);

    const btnTypeToggle = document.getElementById("btnTypeToggle");
    const chatInputForm = document.getElementById("chatInputForm");
    const chatInputField = document.getElementById("chatInputField");

    btnTypeToggle.addEventListener("click", () => {
      chatInputForm.classList.toggle("hidden");
      if (!chatInputForm.classList.contains("hidden")) chatInputField.focus();
    });

    chatInputForm.addEventListener("submit", (e) => {
      e.preventDefault();
      ensureAudioCtx();
      const val = chatInputField.value.trim();
      if (!val) return;
      chatInputField.value = "";
      processUserEnglishMessage(val);
    });

    btnHeadCam.addEventListener("click", () => {
      ensureAudioCtx();
      toggleHeadCam();
    });

    document.getElementById("btnLookAtMe").addEventListener("click", () => {
      ensureAudioCtx();
      handleVisionInteraction("Look at me on camera and comment on what you see.");
    });

    document.getElementById("btnTogglePipMin").addEventListener("click", () => {
      camPipBox.classList.add("hidden");
      btnRestorePip.classList.remove("hidden");
    });
    btnRestorePip.addEventListener("click", () => {
      camPipBox.classList.remove("hidden");
      btnRestorePip.classList.add("hidden");
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      ensureAudioCtx();
      state.targetOrbitYaw = 0;
      state.targetOrbitPitch = 0;
      state.targetX = 0;
      state.targetY = 0;
      state.targetRoll = 0;
      triggerAction("track");
      playServoChirp(420, 300, 0.12);
    });

    document.getElementById("btnSound").addEventListener("click", () => {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById("iconSoundOn").classList.toggle("hidden", !state.soundEnabled);
      document.getElementById("iconSoundOff").classList.toggle("hidden", state.soundEnabled);
      if (!state.soundEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        state.isSpeaking = false;
        state.speechQueueInFlight = 0;
        resetMouthBars();
      } else {
        ensureAudioCtx();
        playServoChirp(380, 560, 0.12);
      }
    });

    document.getElementById("btnFullscreen").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else {
        document.exitFullscreen().catch(() => { });
      }
    });

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (document.activeElement === chatInputField) return;
      const keyMap = {
        "1": "wave", "2": "greet", "3": "nod", "4": "spin", "5": "groove",
        "6": "laugh", "7": "hover", "8": "idle_breathe", "9": "scan"
      };
      const shiftMap = {
        "1": "shake_head", "2": "tilt_head", "3": "shrug", "4": "think",
        "5": "bow", "6": "present", "7": "celebrate", "8": "startle", "9": "facepalm"
      };
      if (e.shiftKey && shiftMap[e.key]) {
        ensureAudioCtx();
        triggerAction(shiftMap[e.key]);
        e.preventDefault();
      } else if (keyMap[e.key]) {
        ensureAudioCtx();
        triggerAction(keyMap[e.key]);
      } else if (e.key.toLowerCase() === "t") {
        ensureAudioCtx();
        triggerAction("track");
      } else if (e.code === "Space" && !e.repeat) {
        e.preventDefault();
        toggleVoiceRecognition();
      }
    });

    // Start physics loop
    window.addEventListener("load", () => {
      requestAnimationFrame(animatePhysics);
      // Show missing-key warnings if either key is absent.
      const hasGroq = !!GROQ_API_KEY;
      const hasGemini = !!GEMINI_API_KEY;
      if (!hasGroq && !hasGemini) {
        updateSubtitle("Add BOTH API keys: GROQ_API_KEY (console.groq.com/keys) and GEMINI_API_KEY (aistudio.google.com/apikey). Edit the <script> tag, save, then refresh.");
        setStatus("Add API Keys", "amber");
      } else if (!hasGroq) {
        updateSubtitle("Add your GROQ_API_KEY (console.groq.com/keys) for chat replies. Vision will work via Gemini.");
        setStatus("Add Groq Key", "amber");
        showModelBadge("gemini", state.activeVisionModel);
      } else if (!hasGemini) {
        updateSubtitle("Add your GEMINI_API_KEY (aistudio.google.com/apikey) for camera vision queries. Chat will work via Groq.");
        setStatus("Add Gemini Key", "amber");
        showModelBadge("groq", state.activeChatModel);
      } else {
        showModelBadge("groq", state.activeChatModel);
      }
    });
  </script>
</body>

</html>
